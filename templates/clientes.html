<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - FitLife Gym</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <header class="hero" style="padding: 40px 20px;">
        <div class="hero-content">
            <h1>👥 Gestión de Clientes</h1>
            <div class="hero-buttons">
                <a href="/dashboard" class="btn-secondary">📊 Dashboard</a>
                <a href="/" class="btn-secondary">🏠 Inicio</a>
            </div>
        </div>
    </header>

    <section style="padding: 40px 20px; max-width: 800px; margin: 0 auto;">
        <h2>Registrar Nuevo Cliente</h2>
        <form id="formCliente" style="background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Nombre completo:</label>
                <input type="text" id="nombre" placeholder="Ej: Juan Pérez" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;" required>
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Email:</label>
                <input type="email" id="email" placeholder="Ej: juan@email.com" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;" required>
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Teléfono:</label>
                <input type="text" id="telefono" placeholder="Ej: 999-999-999" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;" required>
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Estado:</label>
                <select id="estado" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                    <option value="activo">Activo</option>
                    <option value="inactivo">Inactivo</option>
                </select>
            </div>
            <button type="submit" style="background: #e94560; color: white; padding: 12px 30px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; width: 100%;">
                Guardar Cliente
            </button>
        </form>

        <h2 style="margin-top: 40px;">Lista de Clientes</h2>
        <div style="overflow-x: auto; margin-top: 20px;">
            <table id="tablaClientes" style="width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
                <thead style="background: #1a1a2e; color: white;">
                    <tr>
                        <th style="padding: 15px;">ID</th>
                        <th style="padding: 15px;">Nombre</th>
                        <th style="padding: 15px;">Email</th>
                        <th style="padding: 15px;">Teléfono</th>
                        <th style="padding: 15px;">Estado</th>
                        <th style="padding: 15px;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla">
                </tbody>
            </table>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 FitLife Gym - Todos los derechos reservados</p>
        <p><a href="/">Inicio</a> | <a href="/dashboard">Dashboard</a> | <a href="/horarios">Horarios</a></p>
    </footer>

    <script src="{{ url_for('static', filename='js/clientes.js') }}"></script>
</body>
</html>
