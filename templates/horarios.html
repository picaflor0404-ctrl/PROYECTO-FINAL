<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios - FitLife Gym</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <header class="hero" style="padding: 40px 20px;">
        <div class="hero-content">
            <h1>📅 Gestión de Horarios</h1>
            <div class="hero-buttons">
                <a href="/dashboard" class="btn-secondary">📊 Dashboard</a>
                <a href="/" class="btn-secondary">🏠 Inicio</a>
            </div>
        </div>
    </header>

    <section style="padding: 40px 20px; max-width: 1200px; margin: 0 auto;">
        <h2>Lista de Horarios</h2>
        <div style="overflow-x: auto; margin-top: 20px;">
            <table id="tablaHorarios" style="width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
                <thead style="background: #1a1a2e; color: white;">
                    <tr>
                        <th style="padding: 15px;">ID</th>
                        <th style="padding: 15px;">Cliente</th>
                        <th style="padding: 15px;">Día</th>
                        <th style="padding: 15px;">Hora</th>
                        <th style="padding: 15px;">Entrenador</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla">
                    <!-- Aquí se cargarán los horarios -->
                </tbody>
            </table>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 FitLife Gym - Todos los derechos reservados</p>
        <p><a href="/">Inicio</a> | <a href="/dashboard">Dashboard</a> | <a href="/clientes">Clientes</a></p>
    </footer>

    <script src="{{ url_for('static', filename='js/horarios.js') }}"></script>
</body>
</html>
