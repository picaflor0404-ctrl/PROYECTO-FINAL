<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios - FitLife Gym</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <header class="hero" style="padding: 40px 20px;">
        <div class="hero-content">
            <h1>📅 Gestión de Horarios</h1>
            <div class="hero-buttons">
                <a href="/dashboard" class="btn-secondary">📊 Dashboard</a>
                <a href="/" class="btn-secondary">🏠 Inicio</a>
            </div>
        </div>
    </header>

    <section style="padding: 40px 20px; max-width: 800px; margin: 0 auto;">
        <h2>Registrar Nuevo Horario</h2>
        <form id="formHorario" style="background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 30px;">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Cliente:</label>
                <select id="cliente_id" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                    <option value="">Selecciona un cliente</option>
                </select>
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Día:</label>
                <select id="dia" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                    <option value="Lunes">Lunes</option>
                    <option value="Martes">Martes</option>
                    <option value="Miércoles">Miércoles</option>
                    <option value="Jueves">Jueves</option>
                    <option value="Viernes">Viernes</option>
                    <option value="Sábado">Sábado</option>
                    <option value="Domingo">Domingo</option>
                </select>
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Hora:</label>
                <input type="time" id="hora" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;" required>
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Entrenador:</label>
                <select id="entrenador" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;" required>
                    <option value="">Selecciona un entrenador</option>
                    <option value="Juan Pérez">Juan Pérez</option>
                    <option value="María Gómez">María Gómez</option>
                    <option value="Carlos López">Carlos López</option>
                    <option value="Ana Martínez">Ana Martínez</option>
                    <option value="Luis Fernández">Luis Fernández</option>
                    <option value="Pedro Rojas">Pedro Rojas</option>
                    <option value="Sofía Torres">Sofía Torres</option>
                    <option value="Miguel Ángel">Miguel Ángel</option>
                    <option value="Laura Jiménez">Laura Jiménez</option>
                    <option value="David Sánchez">David Sánchez</option>
                </select>
            </div>
            <button type="submit" style="background: #e94560; color: white; padding: 12px 30px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; width: 100%;">
                Guardar Horario
            </button>
        </form>

        <h2>Lista de Horarios</h2>
        <div style="overflow-x: auto; margin-top: 20px;">
            <table id="tablaHorarios" style="width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
                <thead style="background: #1a1a2e; color: white;">
                    <tr>
                        <th style="padding: 15px;">ID</th>
                        <th style="padding: 15px;">Cliente</th>
                        <th style="padding: 15px;">Día</th>
                        <th style="padding: 15px;">Hora</th>
                        <th style="padding: 15px;">Entrenador</th>
                        <th style="padding: 15px;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla">
                </tbody>
            </table>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 FitLife Gym - Todos los derechos reservados</p>
        <p><a href="/">Inicio</a> | <a href="/dashboard">Dashboard</a> | <a href="/clientes">Clientes</a></p>
    </footer>

    <script src="{{ url_for('static', filename='js/horarios.js') }}"></script>
</body>
</html>
